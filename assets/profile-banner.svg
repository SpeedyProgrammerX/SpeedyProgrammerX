<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Devansh Desai</title>
  <desc id="description">Software engineer, educator, and builder</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09152F"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="325" y1="0" x2="875" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#60A5FA" stop-opacity=".38"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="110" cy="48" r="220" fill="url(#glow)">
    <animate attributeName="r" values="200;235;200" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="320" r="260" fill="url(#glow)">
    <animate attributeName="r" values="245;285;245" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".18">
    <path d="M0 290C250 205 385 350 630 267C857 190 954 241 1200 145" stroke="url(#accent)" stroke-width="2"/>
    <path d="M0 310C250 225 385 370 630 287C857 210 954 261 1200 165" stroke="url(#accent)" stroke-width="1"/>
  </g>

  <g>
    <circle cx="1020" cy="90" r="4" fill="#67E8F9">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="145" r="3" fill="#A5B4FC">
      <animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="255" r="3" fill="#C4B5FD">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="80" r="2.5" fill="#7DD3FC">
      <animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(600 77)">
    <rect x="-68" y="-31" width="136" height="42" rx="21" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".16"/>
    <circle cx="-45" cy="-10" r="5" fill="#4ADE80">
      <animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-31" y="-4" fill="#DCEBFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">HELLO, WORLD</text>
  </g>

  <text x="600" y="174" fill="white" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="750" text-anchor="middle" letter-spacing="-2">Devansh Desai</text>
  <rect x="393" y="198" width="414" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="250" fill="#C7D8F7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="450" text-anchor="middle" letter-spacing="2">SOFTWARE ENGINEER  •  EDUCATOR  •  BUILDER</text>

  <g transform="translate(600 302)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">
    <text fill="#7DD3FC">
      <tspan>&lt;</tspan><tspan fill="#E0E7FF">turning ideas into impact</tspan><tspan> /&gt;</tspan>
    </text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="27.25" stroke="url(#accent)" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
